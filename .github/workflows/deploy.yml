name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # Recreates your local .env from ONE repo secret named ENV_FILE.
      # Settings -> Secrets and variables -> Actions -> New repository secret
      # Name: ENV_FILE   Value: paste the full contents of your local .env
      - name: Create .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env
          echo "Variables found in .env:"
          grep -oE '^[A-Za-z_][A-Za-z0-9_]*' .env

      - name: Build
        run: npm run build

      # Lets page refreshes on routes like /settings work (for React Router apps)
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
